stages:
  - test
  - package
  - release

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  image: node:22-bookworm
  stage: test
  script:
    - npm ci --prefer-offline
    - npm test
    - npm run build

package:linux:
  image: electronuserland/builder:22
  stage: package
  needs:
    - test
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --prefer-offline
    - npm run dist:linux
    - mv release/*.AppImage release/Kanbanos-Linux.AppImage
    - mv release/*.deb release/Kanbanos-Linux.deb
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_TAG-linux"
    expire_in: never
    paths:
      - release/Kanbanos-Linux.AppImage
      - release/Kanbanos-Linux.deb

package:windows:
  image: electronuserland/builder:22-wine
  stage: package
  needs:
    - test
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --prefer-offline
    - npm run dist:win
    - mv release/*.exe release/Kanbanos-Windows.exe
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_TAG-windows"
    expire_in: never
    paths:
      - release/Kanbanos-Windows.exe

release:
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
    entrypoint: [""]
  stage: release
  needs:
    - job: package:linux
      artifacts: false
    - job: package:windows
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Kanbanos $CI_COMMIT_TAG"
    description: "See the [changelog]($CI_PROJECT_URL/-/blob/$CI_COMMIT_TAG/CHANGELOG.md)."
    assets:
      links:
        - name: "Windows installer (.exe)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/release/Kanbanos-Windows.exe?job=package:windows"
          link_type: package
        - name: "Linux AppImage (.AppImage)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/release/Kanbanos-Linux.AppImage?job=package:linux"
          link_type: package
        - name: "Linux Debian package (.deb)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/release/Kanbanos-Linux.deb?job=package:linux"
          link_type: package
